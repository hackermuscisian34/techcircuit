name: CANON / FIDELIS CI - Full-Stack Verification & Release Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend-verification:
    name: Backend Security, Migrations & Invariant Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx alembic

      - name: Validate Database Schema Migrations (Alembic)
        working-directory: ./backend
        env:
          DATABASE_URL: sqlite:///test_migration.db
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-at-least-32-chars-long-for-alembic-check
        run: |
          alembic upgrade head
          alembic current
          rm -f test_migration.db

      - name: Run Disaster Recovery & Backup Drill
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-at-least-32-chars-long-for-drill
        run: |
          python scripts/backup_restore.py test-cycle

      - name: Execute Full Pytest Security & Regression Suite
        working-directory: ./backend
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-at-least-32-chars-long-for-tests
          DATABASE_URL: sqlite:///:memory:
          ENABLE_DEV_PERSONA_SWITCHING: true
          ENABLE_DEMO_ACCOUNTS: true
          RATE_LIMIT_ENABLED: false
        run: |
          pytest tests/ -v --tb=short

  frontend-verification:
    name: Frontend Lint, Typecheck & Next.js Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: npm run build
