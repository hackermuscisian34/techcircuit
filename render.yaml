services:
  # ─────────────────────────────────────────────────────────
  # CANON / FIDELIS FastAPI Backend Service
  # ─────────────────────────────────────────────────────────
  - type: web
    name: canon-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: hackathon
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./canon.db

      # Pre-trained Open-Source LLM Settings (Groq / Open-Source Cloud or Heuristic Engine)
      - key: LLM_PROVIDER
        value: auto
      - key: GROQ_API_KEY
        sync: false # Optional: Set free Groq API key in Render Dashboard for 24/7 Llama 3.3
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ALLOW_MOCK_LLM_FALLBACK
        value: "true"

      # Cross-Origin Resource Sharing for Vercel Frontend
      - key: CORS_ORIGINS
        value: "*"
