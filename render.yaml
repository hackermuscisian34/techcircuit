services:
  # ─────────────────────────────────────────────────────────
  # CANON / FIDELIS FastAPI Backend Service
  # ─────────────────────────────────────────────────────────
  - type: web
    name: canon-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set managed PostgreSQL connection string in Render Dashboard
      - key: ENABLE_DEMO_ACCOUNTS
        value: "false"
      - key: ENABLE_DEV_PERSONA_SWITCHING
        value: "false"
      - key: LLM_PROVIDER
        value: auto
      - key: GROQ_API_KEY
        sync: false # Set Groq API key in Render Dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ALLOW_MOCK_LLM_FALLBACK
        value: "false"
      # Cross-Origin Resource Sharing for Production Frontend
      - key: CORS_ORIGINS
        value: "https://fidelis.vercel.app,http://localhost:3000"
